[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-intelligence-backend"
version = "0.1.0"
description = "Backend for the Economic Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "supabase>=2.24,<3.0",
  "postgrest>=2.31,<2.32",
  "openai>=1.60,<2.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
  "statsmodels>=0.14,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "openpyxl>=3.1,<4.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]
[tool.setuptools]
packages = ["app", "api"]
[tool.ruff]
line-length = 100
target-version = "py311"
extend-ignore = ["B008", "BLE001", "I001"]
