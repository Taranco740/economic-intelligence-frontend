name: Build and Test Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Compile backend Python
        run: python -m compileall -q .
      - name: Unit tests
        run: pytest -q -m "not integration"

  supabase-integration:
    runs-on: ubuntu-latest
    needs: [backend-checks]
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_SUPABASE_USER_ID: ${{ secrets.TEST_SUPABASE_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Integration tests against test/staging Supabase
        run: pytest -q -m integration
